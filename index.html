<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кофейня</title>
  <link rel="stylesheet" href="css/style.css">
  <script>window.BASE = '';</script>
</head>
<body>
  <div id="header"></div>
  <main>
    <div class="hero">
      <h1>Кофейня</h1>
      <p>Свежеобжаренные зёрна, авторские напитки и уютная атмосфера</p>
      <a href="catalog.html" class="btn btn--primary">Перейти в каталог</a>
    </div>
    
    <div class="container">
      <div class="section">
        <div class="section__head"><h2>Популярное</h2></div>
        <div class="product-grid" id="featured-products"></div>
      </div>
      
      <div class="section">
        <div class="section__head"><h2>Из блога</h2></div>
        <div class="blog-grid" id="featured-posts"></div>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/blog.js"></script>
  <script>
    document.addEventListener('dbLoaded', function () {
      renderProductGrid('#featured-products', PRODUCTS.filter(p => p.featured).slice(0, 4));
      renderPostGrid('#featured-posts', POSTS.slice(0, 3));
    });
  </script>
</body>
</html>
