<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Кофейня</title>
  <link rel="stylesheet" href="css/style.css">
  <script>window.BASE = '';</script>
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Вход</h1>
        <div class="auth-hint">
          Админ: admin / admin123<br>
          Пользователь: user / user123
        </div>
        <form id="login-form">
          <label class="field"><span>Логин</span><input name="login" required></label>
          <label class="field"><span>Пароль</span><input name="password" type="password" required></label>
          <button type="submit" class="btn btn--primary btn--block">Войти</button>
        </form>
        <p style="margin-top:20px; text-align:center; font-size:14px;">Нет аккаунта? <a href="register.html" style="color:var(--c-primary); font-weight:600;">Зарегистрироваться</a></p>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
