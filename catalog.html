<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — Кофейня</title>
  <link rel="stylesheet" href="css/style.css">
  <script>window.BASE = '';</script>
</head>
<body>
  <div id="header"></div>
  <main class="container" style="padding-top: 40px;">
    <h1 style="font-family: var(--font-heading); font-size: 42px; margin-bottom: 24px;">Каталог</h1>
    <div class="catalog-toolbar">
      <input id="search" type="search" placeholder="Поиск по названию...">
      <select id="category-filter">
        <option value="all">Все категории</option>
        <option value="coffee">Кофе</option>
        <option value="drinks">Напитки</option>
        <option value="desserts">Десерты</option>
        <option value="bakery">Выпечка</option>
      </select>
      <select id="sort">
        <option value="default">По умолчанию</option>
        <option value="price-asc">Цена по возрастанию</option>
        <option value="price-desc">Цена по убыванию</option>
        <option value="name">По названию</option>
      </select>
    </div>
    <div class="catalog-count" id="catalog-count" style="margin-bottom: 24px; color: var(--c-text-muted);"></div>
    <div class="product-grid" id="catalog-grid"></div>
  </main>
  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
